<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F3EF">
<title>Manga Viewer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/style.css">
<script>
/* 첫 화면이 그려지기 전에 테마 적용 (시스템 / 라이트 / 다크) */
(function () {
  var pref = "system";
  try { pref = localStorage.getItem("mv-theme") || "system"; } catch (e) {}
  var sysDark;
  try { sysDark = window.MangaApp ? MangaApp.isSystemDark() : matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) { sysDark = false; }
  document.documentElement.dataset.theme = pref === "dark" || (pref === "system" && sysDark) ? "dark" : "light";
})();
</script>
</head>
<body>
<main id="app"></main>
<nav class="navbar" aria-label="메뉴">
  <div id="jobbar" class="jobbar" hidden></div>
  <div class="tabs">
    <a href="#/ko" data-tab="ko"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5C10 5 7 4.5 3.5 5v13.5C7 18 10 18.5 12 20c2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5z"/><path d="M12 6.5V20"/></svg><span>한국어</span></a>
    <a href="#/fav" data-tab="fav"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 7.9 3.6 4.5 7 4.5c2 0 3.4 1.1 5 3 1.6-1.9 3-3 5-3 3.4 0 5.6 3.4 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg><span>즐겨찾기</span></a>
    <a href="#/saved" data-tab="saved"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v11"/><path d="M7.5 10l4.5 4.5 4.5-4.5"/><path d="M4.5 15.5v3a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-3"/></svg><span>저장</span></a>
    <a href="#/settings" data-tab="settings"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg><span>설정</span></a>
  </div>
</nav>
<div id="toast" class="toast" hidden></div>
<script src="/app.js"></script>
</body>
</html>
