plugins {
    id "com.android.application"
}

// CI 에서 고정된 서명 키를 쓰면 새 버전을 덮어 설치할 수 있음 (VIDSHELF_KEYSTORE 가 없으면 기본 디버그 키)
def stableKeystore = System.getenv("VIDSHELF_KEYSTORE")

android {
    namespace "app.vidshelf"
    compileSdk 34

    defaultConfig {
        applicationId "app.vidshelf"
        minSdk 29
        targetSdk 34
        versionCode 47
        versionName "6.7"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 웹 화면은 PC/Termux 버전과 같은 vidshelf/static 을 그대로 사용
    sourceSets {
        main.assets.srcDirs += ["../../static"]
    }

    signingConfigs {
        if (stableKeystore) {
            stable {
                storeFile file(stableKeystore)
                storePassword "vidshelf"
                keyAlias "vidshelf"
                keyPassword "vidshelf"
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            if (stableKeystore) signingConfig signingConfigs.stable
        }
    }
    lint { abortOnError false }
}

dependencies {
    // 웹 화면에서 재생할 수 없는 형식(MKV, HEVC 등)을 위한 앱 내장 플레이어
    implementation "androidx.media3:media3-exoplayer:1.4.1"
    implementation "androidx.media3:media3-ui:1.4.1"
}
