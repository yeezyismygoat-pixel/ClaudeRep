<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F3EF">
<title>VidShelf</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e8a33d'/%3E%3Cpath d='M12 9l11 7-11 7z' fill='%230f1115'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/style.css">
<script>
/* 첫 화면이 그려지기 전에 테마 적용 (시스템 / 라이트 / 다크) */
(function () {
  var pref = "system";
  try { pref = localStorage.getItem("vs-theme") || "system"; } catch (e) {}
  var sysDark;
  try { sysDark = window.VidShelfApp ? VidShelfApp.isSystemDark() : matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) { sysDark = false; }
  document.documentElement.dataset.theme = pref === "dark" || (pref === "system" && sysDark) ? "dark" : "light";
})();
</script>
</head>
<body>
<header class="topbar">
  <div id="jobbar" class="jobbar" hidden></div>
  <nav class="tabs" aria-label="메뉴">
    <a href="#/home" data-tab="home" aria-label="홈" title="홈"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5L12 3.5l8.5 7"/><path class="f" d="M5.5 9v11h5v-6h3v6h5V9z"/></svg></a>
    <a href="#/media" data-tab="media" aria-label="미디어" title="미디어 (동영상·사진)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4.5" width="15" height="12" rx="2"/><path class="f" d="M8.5 8l4 2.5-4 2.5z"/><path d="M6.5 19.5h13a2 2 0 0 0 2-2v-9"/></svg></a>
    <a href="#/shorts" data-tab="shorts" aria-label="숏폼" title="숏폼 (2분 이하)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path class="f" d="M10.5 9.5l4 2.5-4 2.5z"/></svg></a>
    <a href="#/explore" data-tab="explore" aria-label="탐색" title="탐색 (사람·태그)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path class="f" d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></a>
    <a href="#/library" data-tab="library" aria-label="설정" title="설정 (시청 기록·파일·설정)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect class="f" x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect class="f" x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect class="f" x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect class="f" x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg></a>
  </nav>
</header>
<main id="app"></main>
<div id="toast" class="toast" hidden></div>
<script src="/app.js"></script>
</body>
</html>
