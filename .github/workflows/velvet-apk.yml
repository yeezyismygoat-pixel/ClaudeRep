name: Velvet APK

on:
  push:
    branches: [manga-viewer]
    paths:
      - "velvet/**"
      - ".github/workflows/velvet-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # 매번 같은 서명 키를 써야 새 버전을 덮어 설치할 수 있음.
      # 저장소 비밀값(Secret) VELVET_KEYSTORE_B64 가 있으면 그 키를 씀 (영구).
      # 없으면 Actions 캐시의 키를 씀 (7일 넘게 빌드가 없으면 사라질 수 있음).
      - name: Restore signing key (cache)
        uses: actions/cache@v4
        with:
          path: ~/velvet-signing
          key: velvet-signing-v1

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.VELVET_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/velvet-signing
          if [ -n "$KEYSTORE_B64" ]; then
            if ! printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > ~/velvet-signing/velvet.jks; then
              echo "::error::VELVET_KEYSTORE_B64 비밀값이 올바른 base64 가 아닙니다."
              exit 1
            fi
            echo "서명 키: 저장소 비밀값(VELVET_KEYSTORE_B64) 사용"
          elif [ -f ~/velvet-signing/velvet.jks ]; then
            echo "서명 키: Actions 캐시의 키 사용"
          else
            echo "::warning::서명 키가 없어 새로 만듭니다. 이 버전은 이전 앱을 지우고 설치해야 합니다."
            keytool -genkeypair -keystore ~/velvet-signing/velvet.jks -storepass velvet -keypass velvet \
              -alias velvet -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Velvet"
          fi
          keytool -list -v -keystore ~/velvet-signing/velvet.jks -storepass velvet | grep -m1 SHA256

      - name: Build APK
        working-directory: velvet/android
        run: VELVET_KEYSTORE=$HOME/velvet-signing/velvet.jks gradle --no-daemon assembleDebug

      - name: Rename
        run: cp velvet/android/app/build/outputs/apk/debug/app-debug.apk Velvet.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Velvet-apk
          path: Velvet.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: velvet-apk
          name: Velvet APK
          body: "Velvet — 만화·영상·사진·숏폼을 한 곳에서. 보안 폴더 안의 브라우저로 이 페이지를 열고 Velvet.apk 를 받아 설치하세요."
          files: Velvet.apk
          make_latest: false
