name: Velvet APK

on:
  push:
    branches: [manga-viewer]
    paths:
      - "velvet/**"
      - ".github/workflows/velvet-apk.yml"
  workflow_dispatch:
    inputs:
      allow_new_key:
        description: "서명 키가 지금 올라가 있는 앱과 달라도 올리기 (휴대폰에서 지우고 다시 설치해야 함)"
        type: boolean
        default: false

permissions:
  contents: write

# 두 빌드가 동시에 돌면 서로 다른 서명 키를 만들 수 있으므로 한 번에 하나씩
concurrency:
  group: velvet-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # 매번 같은 서명 키를 써야 새 버전을 덮어 설치할 수 있음.
      # 저장소 비밀값(Secret) VELVET_KEYSTORE_B64 가 있으면 그 키를 씀 (영구).
      # 없으면 Actions 캐시의 키를 씀 (7일 넘게 빌드가 없으면 사라질 수 있음).
      - name: Restore signing key (cache)
        uses: actions/cache@v4
        with:
          path: ~/velvet-signing
          key: velvet-signing-v1

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.VELVET_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/velvet-signing
          if [ -n "$KEYSTORE_B64" ]; then
            if ! printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > ~/velvet-signing/velvet.jks; then
              echo "::error::VELVET_KEYSTORE_B64 비밀값이 올바른 base64 가 아닙니다."
              exit 1
            fi
            echo "서명 키: 저장소 비밀값(VELVET_KEYSTORE_B64) 사용"
          elif [ -f ~/velvet-signing/velvet.jks ]; then
            echo "서명 키: Actions 캐시의 키 사용"
          else
            echo "::warning::서명 키가 없어 새로 만듭니다. 이 버전은 이전 앱을 지우고 설치해야 합니다."
            keytool -genkeypair -keystore ~/velvet-signing/velvet.jks -storepass velvet -keypass velvet \
              -alias velvet -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Velvet"
          fi
          keytool -list -v -keystore ~/velvet-signing/velvet.jks -storepass velvet | grep -m1 SHA256

      # 올라가 있는 Velvet.apk 와 서명 키가 다르면 휴대폰에서 업데이트가 안 되므로 올리지 않음
      - name: Check signing key matches the published app
        env:
          ALLOW_NEW_KEY: ${{ inputs.allow_new_key }}
        run: |
          new=$(keytool -list -v -keystore ~/velvet-signing/velvet.jks -storepass velvet | grep -m1 'SHA256:' | sed 's/.*SHA256: //' | tr -d ': ' | tr 'A-F' 'a-f')
          if curl -fsSL -o /tmp/published.apk "https://github.com/${{ github.repository }}/releases/download/velvet-apk/Velvet.apk"; then
            bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            old=$("$bt/apksigner" verify --print-certs /tmp/published.apk | grep -m1 'SHA-256 digest' | sed 's/.*: //' | tr -d ' ')
            echo "올라가 있는 앱의 키: $old"
            echo "이번 빌드의 키:     $new"
            if [ -n "$old" ] && [ "$old" != "$new" ]; then
              if [ "$ALLOW_NEW_KEY" = "true" ]; then
                echo "::warning::서명 키가 바뀐 버전을 올립니다. 휴대폰에서 이전 앱을 지우고 설치해야 합니다."
              else
                echo "::error::서명 키가 지금 올라가 있는 Velvet.apk 와 다릅니다. 이대로 올리면 휴대폰에서 업데이트가 안 되므로 멈춥니다."
                exit 1
              fi
            fi
          else
            echo "올라가 있는 앱이 없어 비교하지 않습니다."
          fi

      - name: Build APK
        working-directory: velvet/android
        run: VELVET_KEYSTORE=$HOME/velvet-signing/velvet.jks gradle --no-daemon assembleDebug

      - name: Rename
        run: cp velvet/android/app/build/outputs/apk/debug/app-debug.apk Velvet.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Velvet-apk
          path: Velvet.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: velvet-apk
          name: Velvet APK
          body: "Velvet — 만화·영상·사진·숏폼을 한 곳에서. 보안 폴더 안의 브라우저로 이 페이지를 열고 Velvet.apk 를 받아 설치하세요."
          files: Velvet.apk
          make_latest: false
